<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>objects</title>
</head>
<body>
    <script>
        //create object
        const student={
            name:"Ananya",
            class:"B.Tech",
            fee:100000
        }
        document.write("<br> Name : "+student.name);
        document.write("<br> Class : "+student.class);
        document.write("<br> Fee : "+student.fee);
    </script>
</body>
</html>
