<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>objects</title>
</head>
<body>
    <script>
        //create object
        const student={
            name:"Ananya",
            class:"B.Tech",
            fee:100000
        }
        document.write("<br>" + Object.values(student));
        document.write("<br>" + Object.keys(student));
        document.write("<br>" + Object.entries(student));

        for(let key in student){
            document.write("<br>"+ key  +" : " + student[key]);
        }
    </script>
</body>
</html>
