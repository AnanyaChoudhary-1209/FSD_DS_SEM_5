<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrow function</title>
</head>
<body>
    <script>
        const greet = () => "Hello";
        document.write("<br>"+greet());

        const add = (a, b) => a+b;
        document.write("<br>"+add(1, 2));
    </script>
</body>
</html>
