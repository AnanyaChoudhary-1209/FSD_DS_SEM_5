<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add function</title>
</head>
<body>
    <script>
        function add(a, b){
            return(a+b);
        }
        document.write("<br>"+add(1,2));
        document.write("<br>"+add(30,15));
        document.write("<br>"+add(11,22));
        document.write("<br>"+add(64,2));
        document.write("<br>"+add(37,2));
        document.write("<br>"+add(2,82));
    </script>
</body>
</html>
