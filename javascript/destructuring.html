<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Destructuring</title>
</head>
<body>
    <script>
        const student = {
            name: "Ananya",
            course: "B.Tech",
            fee: 100000
        }
        document.write(student.name);
        document.write(student.course);
        document.write(student.fee);

        const {name, course, fee} = student;

        document.write("<br>");

        document.write(name+"<br>");
        document.write(course+"<br>");
        document.write(fee+"<br>");



    </script>
</body>
</html>
